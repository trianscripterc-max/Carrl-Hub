<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrl Hub</title>
<style>
:root{
  --vc-pink:#ff3d9a; --vc-orange:#ff9d3c; --vc-cyan:#22e3e8; --vc-purple:#7a2cff; --vc-deep:#1b0838;
  --pastel:#ffd3e6; --pastel-edge:#ffb3d3;
  --vc-grad:linear-gradient(95deg,#ff3d9a 0%,#ff9d3c 45%,#22e3e8 100%);
  --vc-grad-dark:linear-gradient(95deg,#d4167a 0%,#e0701a 45%,#0a9aa8 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;
  font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
  background:
    radial-gradient(ellipse 70% 40% at 50% 62%,rgba(255,157,60,.55),transparent 70%),
    linear-gradient(180deg,#1b0838 0%,#4a1a8c 38%,#c8338f 66%,#ff7a59 82%,#22e3e8 100%);
  background-attachment:fixed;
  color:#fff;overflow-x:hidden;
}
.grad{background:var(--vc-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.grad-dark{background:var(--vc-grad-dark);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

main{max-width:720px;margin:0 auto;padding:56px 20px 80px;display:flex;flex-direction:column;align-items:center;gap:40px}
h1{
  margin:0;font-size:clamp(3rem,16vw,6.5rem);line-height:1;font-style:italic;font-weight:900;
  letter-spacing:.01em;text-align:center;
  filter:drop-shadow(0 0 18px rgba(255,61,154,.55)) drop-shadow(0 4px 0 rgba(27,8,56,.6));
}

.hub-btn{
  display:flex;align-items:center;gap:18px;width:100%;max-width:520px;
  padding:14px 18px;border-radius:22px;cursor:pointer;
  background:var(--pastel);border:3px solid var(--pastel-edge);
  box-shadow:0 0 0 2px rgba(255,255,255,.35) inset,0 10px 30px rgba(122,44,255,.45);
  font:inherit;text-align:left;
  transition:transform .15s ease,box-shadow .15s ease;
}
.hub-btn:hover{transform:translateY(-2px);box-shadow:0 0 0 2px rgba(255,255,255,.5) inset,0 14px 36px rgba(255,61,154,.55)}
.hub-btn:active{transform:translateY(1px)}
.hub-btn:focus-visible,.pill:focus-visible,input:focus-visible,textarea:focus-visible,.close:focus-visible{outline:3px solid var(--vc-cyan);outline-offset:3px}
.thumb{
  flex:0 0 150px;height:90px;border-radius:16px;overflow:hidden;
  background:linear-gradient(135deg,#ff3d9a,#7a2cff 60%,#22e3e8);
  display:grid;place-items:center;border:2px solid #fff;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{font-size:2rem}
.btn-title{font-size:clamp(1.3rem,6vw,1.9rem);font-weight:900;font-style:italic;line-height:1.1}

.pill{
  font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;
  padding:8px 16px;border-radius:999px;background:var(--pastel);border:2px solid var(--pastel-edge);
}
.fact{width:100%;max-width:520px;background:var(--pastel);border:3px solid var(--pastel-edge);border-radius:20px;padding:14px 18px;box-shadow:0 8px 26px rgba(122,44,255,.35)}
.fact p{margin:0}
.fact-head{font-size:1.15rem;font-weight:900;font-style:italic;margin-bottom:4px!important}
.fact-text{font-size:1rem;font-weight:700;line-height:1.45}
.hint{margin:0;font-size:.85rem;text-align:center;max-width:420px;
  background:var(--pastel);border-radius:14px;padding:10px 14px;border:2px solid var(--pastel-edge);font-weight:700}

/* modal */
.overlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:20;
  background:linear-gradient(160deg,rgba(122,44,255,.28),rgba(255,61,154,.22) 55%,rgba(34,227,232,.25));
  -webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);
}
.overlay.open{display:flex;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.panel{
  position:relative;width:100%;max-width:440px;max-height:92%;overflow:auto;
  background:var(--pastel);border:3px solid var(--pastel-edge);border-radius:26px;padding:28px 22px 24px;
  box-shadow:0 0 40px rgba(255,61,154,.5),0 0 0 2px rgba(255,255,255,.45) inset;
}
.panel h2{margin:0 0 6px;font-size:1.7rem;font-style:italic;font-weight:900}
.panel p{margin:0 0 16px;font-weight:700;font-size:.95rem}
.close{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:2px solid var(--pastel-edge);background:#fff4f9;font:inherit;font-size:1.1rem;font-weight:900;cursor:pointer}
input,textarea{
  width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:14px;
  border:2px solid var(--pastel-edge);background:#fff4f9;color:#6a1250;
}
textarea{min-height:170px;resize:vertical;font-family:Consolas,"Courier New",monospace;font-size:.95rem}
.row{display:flex;gap:10px;margin-top:14px}
.go{flex:1;font:inherit;font-weight:900;font-size:1.05rem;font-style:italic;padding:12px;border-radius:14px;cursor:pointer;
  border:0;background:var(--vc-grad);color:#2a0a40;box-shadow:0 6px 18px rgba(255,61,154,.45)}
.go .ico{display:block;font-size:1.4rem;line-height:1;margin-top:4px;font-style:normal}
.go.alt{background:#fff4f9;border:2px solid var(--pastel-edge)}
.err{min-height:1.3em;margin-top:10px;font-size:.9rem;font-weight:800;text-align:center}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.overlay.open,.shake{animation:none}.hub-btn{transition:none}}
</style>
</head>

<script>
/* O código que aparece para todo mundo fica aqui. */
const CODE = "-- Piggy Hub | Find The Piggy Morphs (ESP / Player / MISC / Config)\n-- Não testado no jogo\nlocal Players = game:GetService(\"Players\")\nlocal UIS = game:GetService(\"UserInputService\")\nlocal RunService = game:GetService(\"RunService\")\nlocal lp = Players.LocalPlayer\n\nif getgenv().PiggyHub then pcall(getgenv().PiggyHub.Close) end\n\nlocal SKIP_WORDS = { \"portal\", \"teleport\", \"warp\", \"dimension\", \"shop\", \"store\", \"door\", \"exit\", \"lobby\", \"spawn\" }\nlocal HINTS = { \"piggy\", \"morph\" }\n\nlocal State = { esp = false, auto = false, fly = false, noclip = false, flySpeed = 60, up = false, down = false, running = true }\nlocal conns = {}\nlocal accentFns = {}\nlocal accent = Color3.fromRGB(88, 101, 242)\nlocal done = {}\nlocal home = nil\nlocal miscStatus, espInfo, guiRef\n\n-- ========== helpers ==========\nlocal function new(class, props, parent)\n    local i = Instance.new(class)\n    for k, v in pairs(props) do i[k] = v end\n    i.Parent = parent\n    return i\nend\nlocal function corner(i, r) new(\"UICorner\", { CornerRadius = UDim.new(0, r or 6) }, i) end\n\nlocal function root()\n    local c = lp.Character\n    return c and c:FindFirstChild(\"HumanoidRootPart\")\nend\nlocal function hum()\n    local c = lp.Character\n    return c and c:FindFirstChildOfClass(\"Humanoid\")\nend\n\nlocal function isInteractive(o)\n    return o:IsA(\"TouchTransmitter\") or o:IsA(\"ProximityPrompt\") or o:IsA(\"ClickDetector\")\nend\n\nlocal function partOf(inst)\n    local p = inst.Parent\n    while p and p ~= workspace do\n        if p:IsA(\"BasePart\") then return p end\n        p = p.Parent\n    end\n    return inst.Parent and inst.Parent:FindFirstChildWhichIsA(\"BasePart\", true)\nend\n\nlocal function hasWord(inst, words)\n    local p = inst\n    for _ = 1, 4 do\n        if not p or p == workspace then break end\n        local n = p.Name:lower()\n        for _, w in ipairs(words) do\n            if n:find(w, 1, true) then return true end\n        end\n        p = p.Parent\n    end\n    return false\nend\n\nlocal function getTargets()\n    local all, hinted = {}, {}\n    local char = lp.Character\n    for _, o in ipairs(workspace:GetDescendants()) do\n        if isInteractive(o) and not (char and o:IsDescendantOf(char)) and not hasWord(o, SKIP_WORDS) then\n            local part = partOf(o)\n            if part and part:IsA(\"BasePart\") and not (part.Parent and part.Parent:FindFirstChildOfClass(\"Humanoid\")) then\n                table.insert(all, o)\n                if hasWord(o, HINTS) then table.insert(hinted, o) end\n            end\n        end\n    end\n    return all, hinted\nend\n\nlocal function grab(inst)\n    local r = root()\n    local part = partOf(inst)\n    if not (r and part) then return end\n    pcall(function() lp:RequestStreamAroundAsync(part.Position) end)\n    r.CFrame = part.CFrame + Vector3.new(0, 3, 0)\n    task.wait(0.25)\n    if inst:IsA(\"TouchTransmitter\") and firetouchinterest then\n        firetouchinterest(r, part, 0)\n        firetouchinterest(r, part, 1)\n    elseif inst:IsA(\"ProximityPrompt\") and fireproximityprompt then\n        fireproximityprompt(inst)\n    elseif inst:IsA(\"ClickDetector\") and fireclickdetector then\n        fireclickdetector(inst)\n    end\nend\n\nlocal function setStatus(t)\n    if miscStatus then miscStatus.Text = t end\nend\n\n-- ========== ESP ==========\nlocal espBoxes = {}\nlocal function clearEsp()\n    for _, b in pairs(espBoxes) do b:Destroy() end\n    espBoxes = {}\n    if espInfo then espInfo.Text = \"Alvos marcados: 0\" end\nend\n\nlocal function refreshEsp()\n    local all = getTargets()\n    local seen, count = {}, 0\n    for _, o in ipairs(all) do\n        local part = partOf(o)\n        if part then\n            seen[part] = true\n            count += 1\n            if not espBoxes[part] then\n                espBoxes[part] = new(\"BoxHandleAdornment\", {\n                    Adornee = part,\n                    Size = part.Size + Vector3.new(0.3, 0.3, 0.3),\n                    AlwaysOnTop = true,\n                    ZIndex = 5,\n                    Transparency = 0.45,\n                    Color3 = Color3.fromRGB(0, 255, 120),\n                }, guiRef)\n            end\n        end\n    end\n    for part, b in pairs(espBoxes) do\n        if not seen[part] then\n            b:Destroy()\n            espBoxes[part] = nil\n        end\n    end\n    if espInfo then espInfo.Text = \"Alvos marcados: \" .. count end\nend\n\n-- ========== Fly / Noclip ==========\nlocal bv\nlocal function stopFly()\n    if bv then bv:Destroy() bv = nil end\n    local h = hum()\n    if h then h.PlatformStand = false end\nend\n\nconns.flight = RunService.RenderStepped:Connect(function()\n    if not State.fly then\n        if bv then stopFly() end\n        return\n    end\n    local r, h = root(), hum()\n    if not (r and h) then return end\n    if not bv or bv.Parent ~= r then\n        if bv then bv:Destroy() end\n        bv = new(\"BodyVelocity\", { MaxForce = Vector3.new(1e9, 1e9, 1e9), Velocity = Vector3.zero }, r)\n    end\n    h.PlatformStand = true\n    local cam = workspace.CurrentCamera\n    local rel = cam.CFrame:VectorToObjectSpace(h.MoveDirection)\n    local v = cam.CFrame.LookVector * (-rel.Z) + cam.CFrame.RightVector * rel.X\n    v = v + Vector3.new(0, (State.up and 1 or 0) - (State.down and 1 or 0), 0)\n    bv.Velocity = v.Magnitude > 0 and v.Unit * State.flySpeed or Vector3.zero\nend)\n\nconns.noclip = RunService.Stepped:Connect(function()\n    if State.noclip and lp.Character then\n        for _, p in ipairs(lp.Character:GetDescendants()) do\n            if p:IsA(\"BasePart\") then p.CanCollide = false end\n        end\n    end\nend)\n\nconns.kbDown = UIS.InputBegan:Connect(function(i, gp)\n    if gp then return end\n    if i.KeyCode == Enum.KeyCode.Space then State.up = true\n    elseif i.KeyCode == Enum.KeyCode.LeftControl then State.down = true end\nend)\nconns.kbUp = UIS.InputEnded:Connect(function(i)\n    if i.KeyCode == Enum.KeyCode.Space then State.up = false\n    elseif i.KeyCode == Enum.KeyCode.LeftControl then State.down = false end\nend)\n\n-- ========== GUI ==========\nlocal guiParent = (gethui and gethui()) or game:GetService(\"CoreGui\")\nif not pcall(function()\n    local t = Instance.new(\"Folder\")\n    t.Parent = guiParent\n    t:Destroy()\nend) then\n    guiParent = lp:WaitForChild(\"PlayerGui\")\nend\n\nlocal gui = new(\"ScreenGui\", { Name = \"PiggyHub\", ResetOnSpawn = false, ZIndexBehavior = Enum.ZIndexBehavior.Sibling, DisplayOrder = 999 }, guiParent)\nguiRef = gui\n\nlocal BG = Color3.fromRGB(30, 30, 38)\nlocal BTN = Color3.fromRGB(55, 55, 65)\nlocal FULL_SIZE = UDim2.fromOffset(300, 290)\nlocal MINI_SIZE = UDim2.fromOffset(300, 32)\n\nlocal main = new(\"Frame\", { Size = FULL_SIZE, Position = UDim2.fromOffset(20, 20), BackgroundColor3 = BG, BorderSizePixel = 0, ClipsDescendants = true }, gui)\ncorner(main, 8)\n\nlocal titleBar = new(\"Frame\", { Size = UDim2.new(1, 0, 0, 32), BackgroundColor3 = accent, BorderSizePixel = 0 }, main)\nnew(\"TextLabel\", {\n    Size = UDim2.new(1, -70, 1, 0), Position = UDim2.fromOffset(10, 0), BackgroundTransparency = 1,\n    Text = \"Piggy Hub\", TextColor3 = Color3.new(1, 1, 1), Font = Enum.Font.GothamBold, TextSize = 15,\n    TextXAlignment = Enum.TextXAlignment.Left,\n}, titleBar)\n\nlocal minBtn = new(\"TextButton\", {\n    Size = UDim2.fromOffset(28, 24), Position = UDim2.new(1, -64, 0, 4), BackgroundColor3 = Color3.fromRGB(0, 0, 0),\n    BackgroundTransparency = 0.7, Text = \"–\", TextColor3 = Color3.new(1, 1, 1), Font = Enum.Font.GothamBold, TextSize = 16,\n}, titleBar)\ncorner(minBtn, 5)\nlocal closeBtn = new(\"TextButton\", {\n    Size = UDim2.fromOffset(28, 24), Position = UDim2.new(1, -32, 0, 4), BackgroundColor3 = Color3.fromRGB(200, 50, 50),\n    Text = \"X\", TextColor3 = Color3.new(1, 1, 1), Font = Enum.Font.GothamBold, TextSize = 14,\n}, titleBar)\ncorner(closeBtn, 5)\n\n-- arrastar\nlocal dragging, dragStart, startPos\ntitleBar.InputBegan:Connect(function(i)\n    if i.UserInputType == Enum.UserInputType.MouseButton1 or i.UserInputType == Enum.UserInputType.Touch then\n        dragging, dragStart, startPos = true, i.Position, main.Position\n        i.Changed:Connect(function()\n            if i.UserInputState == Enum.UserInputState.End then dragging = false end\n        end)\n    end\nend)\nconns.drag = UIS.InputChanged:Connect(function(i)\n    if dragging and (i.UserInputType == Enum.UserInputType.MouseMovement or i.UserInputType == Enum.UserInputType.Touch) then\n        local d = i.Position - dragStart\n        main.Position = UDim2.new(startPos.X.Scale, startPos.X.Offset + d.X, startPos.Y.Scale, startPos.Y.Offset + d.Y)\n    end\nend)\n\nlocal body = new(\"Frame\", { Size = UDim2.new(1, 0, 1, -32), Position = UDim2.fromOffset(0, 32), BackgroundTransparency = 1 }, main)\nlocal tabsBar = new(\"Frame\", { Size = UDim2.new(1, 0, 0, 30), BackgroundTransparency = 1 }, body)\nlocal pagesHolder = new(\"Frame\", { Size = UDim2.new(1, -12, 1, -38), Position = UDim2.fromOffset(6, 34), BackgroundTransparency = 1 }, body)\n\nlocal pages, tabBtns, activeTab = {}, {}, \"MISC\"\nlocal TAB_NAMES = { \"ESP\", \"Player\", \"MISC\", \"Config\" }\n\nlocal function refreshTabs()\n    titleBar.BackgroundColor3 = accent\n    for n, b in pairs(tabBtns) do\n        b.BackgroundColor3 = (n == activeTab) and accent or BTN\n    end\nend\ntable.insert(accentFns, refreshTabs)\n\nlocal function showTab(name)\n    activeTab = name\n    for n, p in pairs(pages) do p.Visible = (n == name) end\n    refreshTabs()\nend\n\nfor idx, n in ipairs(TAB_NAMES) do\n    local b = new(\"TextButton\", {\n        Size = UDim2.new(0.25, -4, 1, -4), Position = UDim2.new((idx - 1) * 0.25, 2, 0, 2),\n        BackgroundColor3 = BTN, Text = n, TextColor3 = Color3.new(1, 1, 1), Font = Enum.Font.GothamMedium, TextSize = 13,\n    }, tabsBar)\n    corner(b, 5)\n    b.MouseButton1Click:Connect(function() showTab(n) end)\n    tabBtns[n] = b\n\n    local page = new(\"ScrollingFrame\", {\n        Size = UDim2.fromScale(1, 1), BackgroundTransparency = 1, ScrollBarThickness = 4, BorderSizePixel = 0,\n        CanvasSize = UDim2.new(), AutomaticCanvasSize = Enum.AutomaticSize.Y, Visible = false,\n    }, pagesHolder)\n    new(\"UIListLayout\", { Padding = UDim.new(0, 6), SortOrder = Enum.SortOrder.LayoutOrder }, page)\n    pages[n] = page\nend\n\nlocal function addLabel(page, text)\n    return new(\"TextLabel\", {\n        Size = UDim2.new(1, -6, 0, 24), BackgroundTransparency = 1, Text = text, TextColor3 = Color3.fromRGB(200, 200, 210),\n        Font = Enum.Font.Gotham, TextSize = 13, TextWrapped = true, TextXAlignment = Enum.TextXAlignment.Left,\n    }, page)\nend\n\nlocal function addButton(page, text, cb)\n    local b = new(\"TextButton\", {\n        Size = UDim2.new(1, -6, 0, 32), BackgroundColor3 = BTN, Text = text, TextColor3 = Color3.new(1, 1, 1),\n        Font = Enum.Font.GothamMedium, TextSize = 14,\n    }, page)\n    corner(b, 6)\n    if cb then b.MouseButton1Click:Connect(cb) end\n    return b\nend\n\nlocal function addToggle(page, text, key, cb)\n    local b = addButton(page, \"\", nil)\n    local function refresh()\n        b.Text = text .. \": \" .. (State[key] and \"ON\" or \"OFF\")\n        b.BackgroundColor3 = State[key] and accent or BTN\n    end\n    b.MouseButton1Click:Connect(function()\n        State[key] = not State[key]\n        refresh()\n        if cb then cb(State[key]) end\n    end)\n    table.insert(accentFns, refresh)\n    refresh()\n    return b\nend\n\n-- botões flutuantes de subir/descer (só aparecem com o voo ligado)\nlocal function floatBtn(text, yOff, key)\n    local b = new(\"TextButton\", {\n        Size = UDim2.fromOffset(56, 56), Position = UDim2.new(1, -72, 0.5, yOff), BackgroundColor3 = BG,\n        BackgroundTransparency = 0.2, Text = text, TextColor3 = Color3.new(1, 1, 1), Font = Enum.Font.GothamBold,\n        TextSize = 22, Visible = false,\n    }, gui)\n    corner(b, 28)\n    b.InputBegan:Connect(function(i)\n        if i.UserInputType == Enum.UserInputType.Touch or i.UserInputType == Enum.UserInputType.MouseButton1 then State[key] = true end\n    end)\n    b.InputEnded:Connect(function(i)\n        if i.UserInputType == Enum.UserInputType.Touch or i.UserInputType == Enum.UserInputType.MouseButton1 then State[key] = false end\n    end)\n    return b\nend\nlocal upBtn = floatBtn(\"▲\", -64, \"up\")\nlocal downBtn = floatBtn(\"▼\", 4, \"down\")\n\n-- ---------- aba ESP ----------\naddToggle(pages.ESP, \"ESP (marcar encostáveis)\", \"esp\", function(on)\n    if on then refreshEsp() else clearEsp() end\nend)\nespInfo = addLabel(pages.ESP, \"Alvos marcados: 0\")\naddLabel(pages.ESP, \"Caixas verdes aparecem através das paredes em tudo que dá para encostar/interagir. Portais são ignorados.\")\n\n-- ---------- aba Player ----------\naddToggle(pages.Player, \"Voar\", \"fly\", function(on)\n    upBtn.Visible = on\n    downBtn.Visible = on\n    if not on then stopFly() end\nend)\naddToggle(pages.Player, \"Noclip\", \"noclip\", nil)\nlocal speedLabel = addLabel(pages.Player, \"Velocidade do voo: \" .. State.flySpeed)\naddButton(pages.Player, \"Velocidade +\", function()\n    State.flySpeed = math.min(State.flySpeed + 10, 200)\n    speedLabel.Text = \"Velocidade do voo: \" .. State.flySpeed\nend)\naddButton(pages.Player, \"Velocidade -\", function()\n    State.flySpeed = math.max(State.flySpeed - 10, 10)\n    speedLabel.Text = \"Velocidade do voo: \" .. State.flySpeed\nend)\naddLabel(pages.Player, \"Voo: joystick/WASD move na direção da câmera. ▲ ▼ na tela (ou Espaço/Ctrl) sobem e descem.\")\n\n-- ---------- aba MISC ----------\naddToggle(pages.MISC, \"Achar e coletar (auto)\", \"auto\", function(on)\n    if on then\n        local r = root()\n        home = r and r.CFrame\n        setStatus(\"Procurando...\")\n    else\n        local r = root()\n        if r and home then r.CFrame = home end\n        home = nil\n        setStatus(\"Parado\")\n    end\nend)\nmiscStatus = addLabel(pages.MISC, \"Parado\")\naddButton(pages.MISC, \"Resetar lista de visitados\", function()\n    done = {}\n    setStatus(\"Lista de visitados limpa\")\nend)\naddLabel(pages.MISC, \"Ao desligar, você volta para onde estava quando ligou.\")\n\n-- ---------- aba Config ----------\naddLabel(pages.Config, \"Cor da interface\")\nlocal COLORS = {\n    { \"Azul\", Color3.fromRGB(88, 101, 242) },\n    { \"Roxo\", Color3.fromRGB(150, 80, 220) },\n    { \"Verde\", Color3.fromRGB(40, 170, 90) },\n    { \"Vermelho\", Color3.fromRGB(210, 60, 60) },\n    { \"Laranja\", Color3.fromRGB(230, 130, 30) },\n    { \"Rosa\", Color3.fromRGB(230, 90, 160) },\n}\nfor _, c in ipairs(COLORS) do\n    local b = addButton(pages.Config, c[1], function()\n        accent = c[2]\n        for _, fn in ipairs(accentFns) do fn() end\n    end)\n    b.BackgroundColor3 = c[2]\nend\n\n-- ---------- minimizar / fechar ----------\nlocal minimized = false\nminBtn.MouseButton1Click:Connect(function()\n    minimized = not minimized\n    body.Visible = not minimized\n    main.Size = minimized and MINI_SIZE or FULL_SIZE\n    minBtn.Text = minimized and \"+\" or \"–\"\nend)\n\nlocal function Close()\n    State.running = false\n    State.fly, State.auto = false, false\n    stopFly()\n    clearEsp()\n    for _, c in pairs(conns) do pcall(function() c:Disconnect() end) end\n    gui:Destroy()\n    getgenv().PiggyHub = nil\nend\ncloseBtn.MouseButton1Click:Connect(Close)\ngetgenv().PiggyHub = { Close = Close }\n\n-- ========== loops ==========\ntask.spawn(function()\n    while State.running do\n        if State.esp then pcall(refreshEsp) end\n        task.wait(3)\n    end\nend)\n\ntask.spawn(function()\n    while State.running do\n        if State.auto then\n            local all, hinted = getTargets()\n            local list = (#hinted >= 20) and hinted or all\n            local n = 0\n            for _, o in ipairs(list) do\n                if not (State.running and State.auto) then break end\n                if o.Parent and not done[o] then\n                    done[o] = true\n                    n += 1\n                    setStatus(\"Coletando... \" .. n .. \"/\" .. #list)\n                    pcall(grab, o)\n                    task.wait(0.3)\n                end\n            end\n            if State.auto then setStatus(\"Passada completa. Procurando novos...\") end\n            task.wait(2)\n        else\n            task.wait(0.5)\n        end\n    end\nend)\n\nshowTab(\"MISC\")";

const FACTS = [
  "Polvos têm três corações.",
  "Mel guardado de forma correta praticamente não estraga: já acharam mel comestível em tumbas do Egito antigo.",
  "Botanicamente, a banana é uma baga. O morango, não.",
  "Em Vênus, um dia dura mais que um ano inteiro do planeta.",
  "As impressões digitais dos coalas são tão parecidas com as humanas que já confundiram investigadores.",
  "Os tubarões existem há mais tempo que as árvores.",
  "O coração do camarão fica na cabeça.",
  "Wombats fazem cocô em formato de cubo.",
  "No verão, a Torre Eiffel pode ficar até uns 15 cm mais alta por causa da dilatação do metal.",
  "A luz do Sol leva cerca de 8 minutos para chegar até a Terra.",
  "Formigas não têm pulmões: elas respiram por pequenos furinhos no corpo.",
  "A língua de uma girafa mede cerca de 45 cm.",
  "Flamingos nascem cinzentos e ficam rosa por causa da alimentação.",
  "Lontras-marinhas dormem de mãos dadas para não se afastarem na água.",
  "Gatos não sentem o gosto doce.",
  "Tubarões trocam de dentes a vida toda.",
  "Existem mais árvores na Terra do que estrelas na Via Láctea.",
  "Um raio aquece o ar ao redor a cerca de 30.000 °C.",
  "O olho da lula-gigante pode ter uns 25 cm, do tamanho de um prato.",
  "Nos cavalos-marinhos, é o macho que fica grávido.",
  "Saturno é menos denso que a água: ele boiaria numa banheira gigante.",
  "A palavra “robô” vem do tcheco “robota”, que quer dizer trabalho forçado.",
  "O Mario se chamava Jumpman quando apareceu no Donkey Kong, em 1981.",
  "O Roblox foi lançado em 2006.",
  "O Brasil é o maior produtor de café do mundo há mais de 150 anos."
];
(function(){
  let i = Math.floor(Math.random() * FACTS.length), last = -1;
  try{ last = parseInt(localStorage.getItem("carrl-fact"), 10); }catch(e){}
  if(i === last) i = (i + 1 + Math.floor(Math.random() * (FACTS.length - 1))) % FACTS.length;
  try{ localStorage.setItem("carrl-fact", String(i)); }catch(e){}
  document.getElementById("fact").textContent = FACTS[i];
})();

const $ = id => document.getElementById(id);
const overlay = $("overlay");
$("script").value = CODE;

function openModal(){ overlay.classList.add("open"); $("saved").textContent = ""; $("copy").focus(); }
function closeModal(){ overlay.classList.remove("open"); }

$("openBtn").addEventListener("click", openModal);
$("closeBtn").addEventListener("click", closeModal);
overlay.addEventListener("click", e => { if(e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

$("copy").addEventListener("click", async () => {
  try{
    await navigator.clipboard.writeText(CODE);
    $("saved").textContent = "Copiado.";
  }catch(e){
    $("script").select();
    $("saved").textContent = "Selecione e copie o texto acima.";
  }
});
</script>
